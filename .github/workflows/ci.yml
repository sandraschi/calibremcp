name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Windows check
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit -q --tb=short

      - name: Import smoke
        run: uv run python -c "from calibre_mcp.server import mcp; print(mcp.name)"
