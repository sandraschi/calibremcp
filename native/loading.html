<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
body { margin:0; background:#0f172a; color:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.loader { text-align:center; }
.spinner { width:40px; height:40px; border:3px solid #334155; border-top-color:#f59e0b; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }
p { font-size:14px; margin:0; }
</style>
</head>
<body>
<div class="loader">
<div class="spinner"></div>
<p>Starting Calibre MCP...</p>
</div>
</body>
</html>
